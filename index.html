<!DOCTYPE html>
<html lang="en" data-page="home">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MixDemo — Mixpanel Demo Store</title>
<script src="assets/mixpanel-setup.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div class="demo-banner" id="promoBanner" style="display:none;"></div>
<header id="siteHeader"></header>

<!-- ============================================================ -->
<!-- HOME PAGE                                                     -->
<!-- ============================================================ -->
<main class="page">
  <div class="hero-banner" id="heroBanner"
     src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600&q=80">
    <div class="hero-content">
      <div class="hero-eyebrow">New season</div>
      <h2 class="hero-title">Well-made goods for everyday life</h2>
      <p class="hero-sub">Thoughtfully designed essentials, built to last.</p>
      <button class="btn-primary"
              onclick="document.getElementById('productGrid').scrollIntoView({ behavior: 'smooth' })">
        Shop the collection
      </button>
    </div>
  </div>
  <script>
    (function () {
      const hero = document.getElementById("heroBanner");
      const applySrc = () => {
        const src = hero.getAttribute("src");
        hero.style.backgroundImage = src ? `url("${src}")` : "";
      };
      applySrc();
      // Re-apply whenever src changes (e.g. a visual experiment variant)
      new MutationObserver(applySrc).observe(hero, { attributes: true, attributeFilter: ["src"] });
    })();
  </script>

  <h1 style="margin-bottom: 8px;">Shop everything</h1>
  <p style="color: var(--muted); margin-bottom: 24px;">Curated essentials for your everyday.</p>

  <input type="text" class="search-bar" id="searchBar" placeholder="Search products..." />

  <div class="filters" id="filters">
    <div class="filter-chip active" data-cat="all">All</div>
    <div class="filter-chip" data-cat="electronics">Electronics</div>
    <div class="filter-chip" data-cat="apparel">Apparel</div>
    <div class="filter-chip" data-cat="home">Home</div>
  </div>

  <div class="product-grid" id="productGrid"></div>
</main>

<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script src="assets/pages/home.js"></script>
</body>
</html>
