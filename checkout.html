<!DOCTYPE html>
<html lang="en" data-page="checkout">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — MixDemo</title>
<script src="assets/mixpanel-setup.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div class="demo-banner" id="promoBanner" style="display:none;"></div>
<header id="siteHeader"></header>

<!-- ============================================================ -->
<!-- CHECKOUT PAGE                                                 -->
<!-- ============================================================ -->
<main class="page">
  <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
  <h1 style="margin-bottom: 24px;">Checkout</h1>
  <div class="checkout-grid">
    <div class="panel">
      <h3 style="margin-bottom: 16px;">Shipping details</h3>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="ckName" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="ckEmail" />
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="ckAddress" />
      </div>
      <div class="form-group">
        <label>ZIP code (must be exactly 6 characters — no error shown)</label>
        <input type="text" id="ckZip" />
      </div>
      <h3 style="margin: 24px 0 16px;">Payment</h3>
      <div class="form-group">
        <label>Card number</label>
        <input type="text" class="mp-mask" id="ckCard" placeholder="•••• •••• •••• ••••" />
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Expiry</label>
          <input type="text" class="mp-mask" id="ckExp" placeholder="MM/YY" />
        </div>
        <div class="form-group">
          <label>CVV</label>
          <input type="text" class="mp-mask" id="ckCvv" placeholder="•••" />
        </div>
      </div>
      <button class="btn-primary" id="placeOrderBtn" style="width: 100%; margin-top: 16px;" onclick="completePurchase()">Place order</button>
    </div>
    <div class="cart-summary" id="checkoutSummary"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script src="assets/pages/checkout.js"></script>
</body>
</html>
